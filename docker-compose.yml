services:
  pebackend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: pebackend
    restart: unless-stopped

    ports:
      - "8088:8088"

    environment:
      API_HOST: "0.0.0.0"
      API_PORT: "8088"
      MONGO_URI: "${MONGO_URI}"
      MONGO_DB: "${MONGO_DB}"
      DB_NAME: "${MONGO_DB}"
      JWT_SECRET: "${JWT_SECRET}"