services:
  pebackend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: pebackend
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      API_HOST: "0.0.0.0"
      API_PORT: "8080"
      MONGO_URI: "${MONGO_URI}"
      MONGO_DB: "${MONGO_DB}"
      JWT_SECRET: "${JWT_SECRET}"